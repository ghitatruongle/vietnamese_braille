name: Vietnamese Braille CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/viet_braille_core

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: dart analyze

      - name: Verify TT15 source integrity and exact fixture
        run: python ../../tools/compliance_report.py --json > tt15-compliance.json

      - name: Test repository evidence tools
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s tools/tests -v

      - name: Upload TT15 compliance evidence
        uses: actions/upload-artifact@v4
        with:
          name: tt15-compliance-${{ matrix.os }}
          path: packages/viet_braille_core/tt15-compliance.json

      - name: Test with VM coverage
        run: dart test --coverage=coverage

      - name: Convert core coverage to LCOV
        if: runner.os == 'Linux'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -i coverage -o coverage/lcov.info

      - name: Enforce core coverage
        if: runner.os == 'Linux'
        run: python ../../tools/check_lcov.py --file coverage/lcov.info --minimum 90

      - name: Upload core coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage
          path: packages/viet_braille_core/coverage/lcov.info

  app:
    name: Flutter app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: viet_braille_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage --no-pub

      - name: Enforce app coverage
        if: runner.os == 'Linux'
        run: python ../tools/check_lcov.py --file coverage/lcov.info --minimum 80

      - name: Upload app coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: viet_braille_app/coverage/lcov.info

  api:
    name: REST API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: api_server

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: dart pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed bin lib test

      - name: Analyze
        run: dart analyze

      - name: Test handlers with VM coverage
        run: dart test --coverage=coverage

      - name: Convert API coverage to LCOV
        if: runner.os == 'Linux'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage --packages=.dart_tool/package_config.json --report-on=lib --lcov -i coverage -o coverage/lcov.info

      - name: Enforce API coverage
        if: runner.os == 'Linux'
        run: python ../tools/check_lcov.py --file coverage/lcov.info --minimum 90

      - name: Upload API coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api_server/coverage/lcov.info

  windows-release:
    name: Windows x64 release
    runs-on: windows-latest
    needs: [core, api, app]
    defaults:
      run:
        working-directory: viet_braille_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build Windows x64 release
        run: flutter build windows --release --no-pub

      - name: Upload runnable Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: braille-tieng-viet-windows-x64
          path: viet_braille_app/build/windows/x64/runner/Release
          if-no-files-found: error

  other-release-builds:
    name: Web and Android release builds
    runs-on: ubuntu-latest
    needs: [core, api, app]
    defaults:
      run:
        working-directory: viet_braille_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get --enforce-lockfile

      - name: Build web release
        run: flutter build web --release --no-pub

      - name: Build unsigned Android App Bundle
        run: flutter build appbundle --release --no-pub

      - uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            viet_braille_app/build/web
            viet_braille_app/build/app/outputs/bundle/release/*.aab

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
