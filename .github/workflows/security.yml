name: Dependency security scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv:
    name: OSV scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=packages/viet_braille_core/pubspec.lock
        --lockfile=api_server/pubspec.lock
        --lockfile=viet_braille_app/pubspec.lock
      fail-on-vuln: true
