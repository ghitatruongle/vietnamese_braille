site_name: Vietnamese Braille
site_description: Vietnamese Braille Converter - Text to Braille Unicode and reverse
site_url: https://<owner>.github.io/vietnamese-braille/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  language: vi

nav:
  - Trang chủ: index.md
  - Hướng dẫn sử dụng: user-guide.md
  - Kiến trúc: architecture.md
  - Đóng góp: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/<owner>/vietnamese-braille
