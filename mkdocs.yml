site_name: Vietnamese Braille
site_description: Vietnamese Braille Converter - Text to Braille Unicode and reverse
site_url: https://ghitatruongle.github.io/vietnamese-braille/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  language: vi

nav:
  - Trang chủ: index.md
  - Hướng dẫn sử dụng: user-guide.md
  - Đối chiếu Thông tư 15: tt15-compliance.md
  - Kiểm thử khả năng tiếp cận: accessibility-testing.md
  - Xác thực bên ngoài:
      - Tổng quan: external-validation/index.md
      - Kịch bản trình đọc màn hình: external-validation/screen-reader-scripts.md
      - Phiếu nghiệm thu người dùng: external-validation/user-validation-survey.md
      - Gói đối chiếu chuyên gia: external-validation/expert-review-packet.md
  - Quyền riêng tư: privacy.md
  - Mô hình đe dọa: threat-model.md
  - Checklist phát hành: release-checklist.md
  - Ma trận Phase 0–5: phase-0-5-audit.md
  - Số liệu chất lượng: metrics.md
  - Quyết định kiến trúc: adr/README.md
  - Kiến trúc: architecture.md
  - Đóng góp: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ghitatruongle/vietnamese-braille
