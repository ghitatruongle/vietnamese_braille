name: viet_braille_app
description: "Ứng dụng chuyển đổi văn bản tiếng Việt sang chữ Braille Unicode (8-dot, U+2800–U+28FF)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  viet_braille_core:
    path: ../packages/viet_braille_core
  cupertino_icons: ^1.0.8
  file_picker: ^8.0.0
  docx_to_text: ^1.0.0
  google_mlkit_text_recognition: ^0.15.0
  path_provider: ^2.1.1
  share_plus: ^10.0.0
  flutter_riverpod: ^2.4.9
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  speech_to_text: ^7.4.0
  pdf: ^3.10.0
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
